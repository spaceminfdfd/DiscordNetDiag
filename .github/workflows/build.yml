
name: Build DiscordNetDiag

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install dpkg ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$HOME/sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks"/iPhoneOS*.sdk "$HOME/theos/sdks/"

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          make package

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: DiscordNetDiag-deb
          path: packages/*.deb
